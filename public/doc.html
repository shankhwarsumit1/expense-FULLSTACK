<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <title>Expense Tracker</title>
</head>

<body>
    <h1 style="text-align: center;">EXPENSE TRACKER</h1>
    <form>
        <div class="input-group">

            <div class="input-group-text">$</div>
            <div class="form-floating">
                <input type="number" required class="form-control" id="amount" name="amount" placeholder="Amount">
                <label for="amount" class="form-label">Amount</label>
            </div>

            <div class="form-floating">

                <input type="text" class="form-control" required id="description" name="description"
                    placeholder="Description">
                <label for="description" class="form-label">Description</label>

            </div>

            <div class="form-floating">
                <select id="category" class="form-select" required name="category" placeholder="category">
                    <option value="food">Food</option>
                    <option value="transportation">Transportation</option>
                    <option value="entertainment">Entertainment</option>
                    <option value="utilities">Utilities</option>
                    <option value="other">Other</option>
                </select>
                <label for="category" class="form-label">Chose Category</label>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Add Expense</button>
    </form>
    <ul class="container g-5"></ul>
</body>
<script src="index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

</html>
